apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wasteco-api
  namespace: wasteco
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - wasteco.faisalaffan.com
      secretName: wasteco-tls
  rules:
    - host: wasteco.faisalaffan.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wasteco-api
                port:
                  number: 8080
