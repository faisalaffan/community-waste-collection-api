apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wasteco

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml

secretGenerator:
  - name: wasteco-secret
    envs:
      - .env.secret

commonLabels:
  app.kubernetes.io/name: wasteco-api
  app.kubernetes.io/part-of: community-waste-collection
